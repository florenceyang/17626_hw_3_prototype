<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local weather</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #eef4fa; color: #1d2b36; }
      h1 { font-size: 1.4rem; }
      .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
      .temp { font-size: 2.5rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Local weather</h1>
    <div class="card"><div class="temp">54°F</div><div>Partly cloudy</div></div>
    <div class="card">
      <strong>This week</strong>
      <p>Mon 52° · Tue 55° · Wed 49° · Thu 47° · Fri 51°</p>
    </div>
    <div class="card"><strong>Tip</strong><p>Light jacket recommended this evening.</p></div>
  </body>
</html>
